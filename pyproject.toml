[project]
name = "supercap-pipeline"
version = "0.1.0"
description = "Supercapacitor cyclic voltammetry analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.scripts]
supercap-run = "supercap_pipeline.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supercap_pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
